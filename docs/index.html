<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        .breathing-instructions {
            /* list-style: none; */
            padding: 0;
            margin: 0 0 0 50px;
            /* text-align: center; */
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }
        
        .breathing-instructions li {
            margin-bottom: 8px;
        }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .bpm-label {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .bpm-value {
            font-size: 24px;
            color: #666;
        }
        
        input[type="range"] {
            width: 200px;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #666;
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #666;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .beat-indicator {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            transition: background-color 0.1s ease;
        }
        
        .green {
            background-color: #c8e6c9;
        }
        
        .blue {
            background-color: #bbdefb;
        }
        
        .pink {
            background-color: #f8bbd0;
        }
        
        .darkgreen {
            background-color: #c6e4c7;
        }
        
        .darkblue {
            background-color: #b9dcf9;
        }
        
        .darkpink {
            background-color: #f6b9ce;
        }
    </style>
</head>
<body>
    <div class="container">
        <ul class="breathing-instructions">
            <li>Inhale through your nose for 4 seconds</li>
            <li>Hold your breath for 7 seconds</li>
            <li>Exhale slowly through your mouth for 8 seconds</li>
            <li>Repeat 4-6 times</li>
        </ul>
        <div class="slider-container">
            <div class="bpm-label">BPM</div>
            <input type="range" id="bpmSlider" min="30" max="90" step="10" value="70">
            <div class="bpm-value" id="bpmValue">70</div>
        </div>
        
        <div class="beat-indicator green" id="beatIndicator"></div>
    </div>

    <script>
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmValue = document.getElementById('bpmValue');
        const beatIndicator = document.getElementById('beatIndicator');
        
        let currentBeat = 0;
        let intervalId = null;
        
        const beatPattern = [
            { beats: 3, color: 'green' },
            { beats: 1, color: 'darkgreen' },
            { beats: 6, color: 'blue' },
            { beats: 1, color: 'darkblue' },
            { beats: 7, color: 'pink' },
            { beats: 1, color: 'darkpink' }
        ];
        
        function updateBeatIndicator() {
            let beatCount = 0;
            let targetColor = 'green';
            
            for (const segment of beatPattern) {
                if (currentBeat < beatCount + segment.beats) {
                    targetColor = segment.color;
                    break;
                }
                beatCount += segment.beats;
            }
            
            beatIndicator.className = `beat-indicator ${targetColor}`;
        }
        
        function tick() {
            currentBeat = (currentBeat + 1) % 19;
            updateBeatIndicator();
        }
        
        function startMetronome() {
            if (intervalId) {
                clearInterval(intervalId);
            }
            
            const bpm = parseInt(bpmSlider.value);
            const interval = 60000 / bpm;
            
            intervalId = setInterval(tick, interval);
        }
        
        bpmSlider.addEventListener('input', (e) => {
            bpmValue.textContent = e.target.value;
            startMetronome();
        });
        
        // Start the metronome
        startMetronome();
    </script>
</body>
</html>
